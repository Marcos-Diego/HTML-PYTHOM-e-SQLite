<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/static/css/index.css">
    <title>Cadastrar Item</title>
</head>
<body class="flex min-h-screen">
<!--=======================MENU=======================-->
    <aside class="bg-[#FD6E23] w-[20rem] grid grid-rows-[auto 1fr] shrink-0">
        <nav class="flex px-[1rem] flex-col text-lg">
            <button id="menu_achados" class="menu" type="button">Achados e Perdidos</button>
            <div id="opcoes_de_achados" class="flex flex-col  bg-[#F05300]">
                <button class="menu inline" type="button" onclick="window.location.href = '/senac/achados_e_perdidos'">Lista</button>
                <button class="menu" type="button" onclick="window.location.href = '/senac/cadastro'">Cadastro</button>
                <button class="menu" type="button" onclick="window.location.href = '/senac/editar'">Editar</button>
            </div>
        </nav>
    </aside>

<!--=======================FORM=======================-->
    <div class="px-[4.9rem]">
        <section class=" pt-[4.25rem] bg-[#ffffff] pb-[5rem]">
            <h1 class="text-[4rem] mb-[8.25rem]">Registrar</h1>
            <form action="{{ url_for('btw_cadastrar') }}" method="POST">
                <table class="table-fixed table-auto">
                    <thead>
                        <tr>
                            <th>
                                <label for="nome">Nome</label>
                            </th>
                            <th>
                                <label for="descricao">Descrição</label>
                            </th>
                            <th>
                                <label for="data">Data</label>
                            </th>
                            <th>
                                <label for="local">Local</label>
                            </th>
                            <th>
                                <label for="situacao">Situação</label>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>

                            <td>
                                <input type="text" id="nome" name="nome" required>
                            </td>
                            <td>
                                <input type="text" id="descricao" name="descricao" required>
                            </td>
                            <td>
                                <input type="text" id="data" name="data">
                            </td>
                            <td>
                                <input type="text" id="local" name="local" required>
                            </td>
                            <td >
                                <select id="situacao" name="situacao" required>
                                    <option value="Devolvido">Devolvido</option>
                                    <option value="Perdido">Perdido</option>
                                </select>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <button type="submit">Cadastrar</button>
            </form>
        </section>
        <button type="button" onclick="window.location.href = '/senac/achados_e_perdidos'">Voltar</button>
    </div>    
</body>
</html>
